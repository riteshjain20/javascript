    let noOfTimesClicked = localStorage.getItems('noOfTimesClicked') || 0;
    function buttonpressed(){
      noOfTimesClicked ++;
      localStorage.setItems('noOfTimesClicked', noOfTimesClicked);
      // document.querySelector('#my-btn').innerText = noOfTimesClicked;
      updatebutton();
    }
    function updatebutton(){
      let button = document.querySelector('#my-btn');
      if(noOfTimesClicked % 2 === 0){
        button.classList.remove('odd');
        button.classList.add('even');
      }
      else{
        button.classList.remove('even');
        button.classList.add('odd');
      }
      button.innerText = noOfTimesClicked;
    }
    updatebutton();




  </script>
