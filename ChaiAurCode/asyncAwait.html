  <title>ASYNC AWAIT</title>
</head>
<body>
  <div>
    <h1>Async Await</h1>
    <div id="insert">
      <div class="key">Press the key</div>
    </div>
    <div>
      <p></p>
      <button id="start">Start</button>
      <button id="stop">Stop</button>
    </div>

  </div>
  <script>

    const insert = document.getElementById('insert');
    window.addEventListener('keydown',(e)=>{
      insert.innerHTML = `
          <div class="color">
      <table>
        <tr>
          <th>key</th>
          <th>keycode</th>
          <th>Code</th>
        </tr>
        <tr>
          <th>${e.key}</th>
          <th>${e.keycode}</th>
          <th>${e.code}</th>
        </tr>
      </table>
    </div>
      `;
    })
