<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guess Challenge</title>
</head>
<body>
  <div class="wrapper">
    <h1>Number Guessing Challenging</h1>
    <form action="" class="form">
      <label for="guessfield" id="guess"></label>
      <input type="text" class="guessfield" id="guessfield">
      <input type="submit" value="Submit Guess" id="subt" class="guesssubmit">
      <div class="resultparas">
        <p>Previous Guesses : <span class="guesses"></span></p>
        <p>Previous Remaining : <span class="lastresult">10</span></p>
        <p class="loworhi"></p>
      </div>
    </form>
  </div>
  <script>
    let randomNumber = parseInt(Math.random()*100+1);
    const submit = document.querySelector('#subt');
    const userInput = document.querySelector('#guessfield');
    const guessSlot = document.querySelector('.guesses');
    const remaining = document.querySelector('.lastresult');
    const lowOrHigh = document.querySelector('.loworhi');
    const startOver = document.querySelector('.resultparas');

    const p = document.createElement('p');
    let prevGuess = [];
    let numGuess = 1;
    let playGame = true;
    if(playGame){
      submit.addEventListener('click',(e)=>{
        e.preventDefault();
        const guess= parseInt(userInput.value);
        console.log(guess);
        validateGuess(guess);
      })
    }
    function validateGuess(guess){
      if(isNaN(guess)){
        alert('Pleae enter a valid number');
      }
      else if(guess < 1){
        alert('Pleae enter a number between 1 to 100');
      }
      else if(guess > 100){
        alert('Pleae enter a number between 1 to 100');
      }else{
        prevGuess.push(guess);
        if(numGuess === 11){
          displayGuess(guess);
          displayMessage(`Game Over, random number was ${randomNumber}`);
          endGame();
        }else{
          displayGuess(guess);
          checkGuess(guess);
        }
      }
    }
    function checkGuess(guess){
      if(guess === randomNumber){
        displayMessage(`you guess a right number`);
        endGame();
      }else if(guess < randomNumber){
        displayMessage(`Number is too low`);
      }else if(guess > randomNumber){
        displayMessage(`Number is too high`);
      }
    }
    function displayGuess(guess){
      userInput.value = '';
      guessSlot.innerHTML += `${guess} `;
      numGuess++;
      remaining.innerHTML = `${11-numGuess}`;
    }
    function displayMessage(message){
      lowOrHigh.innerHTML = `<h3>${message}</h3>`;
    }
    function endGame(){
      userInput.value = '';
      userInput.setAttribute('disabled' ,'');
      p.classList.add('button');
      p.innerHTML = `<h2 id='newGame'>Start New Game</h2>`;
      startOver.appendChild(p);
      playGame = false;
      newGame();
    }
    function newGame(){
      const newGameButton = document.querySelector('#newGame');
      newGameButton.addEventListener('click',(e)=>{
        randomNumber = parseInt(Math.random()*100+1);
        prevGuess=[];
        numGuess = 1;
        guessSlot.innerHTML ='';
        remaining.innerHTML = `${11-numGuess}`;
        userInput.removeAttribute('disabled');
        startOver.removeChild(p);
        displayMessage('');
        playGame=true;
      })
    }
    
  </script>
</body>
</html>
