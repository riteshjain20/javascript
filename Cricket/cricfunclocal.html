<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket</title>
</head>
<body>
  <h1>Cricket Game</h1>

  <button 
  onclick="
  let computerChoice = generateRandomNumber();
  let resultMsg = getResult('Bat', computerChoice);
  showResult('Bat', computerChoice, resultMsg);
  ">Bat</button>


  <button onclick="
  let computerChoice = generateRandomNumber();
  let resultMsg = getResult('Ball', computerChoice);
  showResult('Ball', computerChoice, resultMsg);
  ">Ball</button>


  <button onclick="
  let computerChoice = generateRandomNumber();
  let resultMsg = getResult('Stump', computerChoice);
  showResult('Stump', computerChoice, resultMsg);
  ">Stump</button>

  <button onclick="localStorage.clear(); resetScore();">Reset</button>

  <div>
    <p id="user-move"></p>
    <p id="computer-move"></p>
    <p id="result"></p>
    <p id="score"></p>
  </div>


<script>
  let scoreStr = localStorage.getItem('Score');
  let score;
  resetScore(scoreStr);

  function resetScore(scoreStr){
    score = scoreStr ?  JSON.parse(scoreStr) : {
      win : 0,
      lost : 0,
      tie : 0,
    };
    score.displayScore = function(){
      return `Win : ${score.win}, Lost : ${score.lost}, Tie : ${score.tie}`;
    }
  }


  function generateRandomNumber(){
    let randomNumber = Math.random()*3;
    if(randomNumber > 0 && randomNumber <= 1){
      return 'Bat';
    }
    else if(randomNumber > 1 && randomNumber <= 2){
      return 'Ball';
    }
    else {
      return 'Stump';
    }
  }
  function getResult(userMove, computerMove){
    if(userMove === 'Bat'){
      if(computerMove === 'Bat'){
        score.tie++;
        return `Match Draw`;
      }
      else if(computerMove === 'Ball'){
        score.win++;
        return `User Won`;
      }
      else if(computerMove === 'Stump'){
        score.lost++;
        return `Computer Won`;
      }
    }
    else if(userMove === 'Ball'){
      if(computerMove === 'Bat'){
        score.lost++;
        return `Computer Won`;
      }
      else if(computerMove === 'Ball'){
        score.tie++;
        return `Match Draw`;
      }
      else if(computerMove === 'Stump'){
        score.win++;
        return `User Won`;
      }
    }
    else{
      if(computerMove === 'Bat'){
        score.win++;
        return `User Won`;
      }
      else if(computerMove === 'Ball'){
        score.lost++;
        return `Computer Won`;
      }
      else if(computerMove === 'Stump'){
        score.tie++;
        return `Match Draw`;
      }
    }
  }
  function showResult(userMove, computerMove, result){
    localStorage.setItem('Score', JSON.stringify(score));
    document.querySelector('#user-move').innerText = `User's Choice is ${userMove}`;
    document.querySelector('#computer-move').innerText = `Computer's Choice is ${computerMove}`;
    document.querySelector('#result').innerText = result;
    document.querySelector('#score').innerText = score.displayScore();
    // alert(`User's Choice is ${userMove} \n Computer's Choice is ${computerMove} \n Result is ${result} \n ${score.displayScore()}`);
  }
</script>
</body>
</html>
