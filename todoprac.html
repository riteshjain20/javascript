<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div>
    <h1>TODO LIST</h1>
    <div>
      <div>
        <input id="todoinput" type="text" placeholder="Enter List Here...">
        <input id="tododate" type="date">
        <button onclick="addtodo()">ADD</button>
        <div id="todocontainer"></div>
      </div>
    </div>
  </div>
  <script>
    let todoList = [];
    displayitems();
    function addtodo(){
      let inputElement = document.querySelector('#todoinput');
      let dateElement = document.querySelector('#tododate');
      let todoItem = inputElement.value;
      let todoDate = dateElement.value;
      todoList.push({item : todoItem, dueDate : todoDate});
      inputElement.value = '';
      dateElement.value = '';
      displayitems();
    }

    function displayitems(){
      let displayElement = document.querySelector('#todocontainer');
      let newhtml = '';
      displayElement.innerText = '';
      for(i=0; i<todoList.length; i++){
        let {item, dueDate} = todoList[i];
        newhtml += `
        <div>
          <span>${item}</span>
          <span>${dueDate}</span>
          <button onclick="todoList.splice(${i}, 1); displayitems();">Delete</button>
        </div>
      `;
      displayElement.innerHTML = newhtml;
      }
    }
  </script>
</body>
</html>
