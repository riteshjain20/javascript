<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket</title>
</head>
<body>
  <h1>Cricket Game</h1>

  <button 
  onclick="
  let computerChoice = generateRandomNumber();
  let resultMsg = getResult('Bat', computerChoice);
  showResult('Bat', computerChoice, resultMsg);
  ">Bat</button>


  <button onclick="
  let computerChoice = generateRandomNumber();
  let resultMsg = getResult('Ball', computerChoice);
  showResult('Ball', computerChoice, resultMsg);
  ">Ball</button>


  <button onclick="
  let computerChoice = generateRandomNumber();
  let resultMsg = getResult('Stump', computerChoice);
  showResult('Stump', computerChoice, resultMsg);
  ">Stump</button>


<script>
  // let computerChoice;
  function generateRandomNumber(){
    let randomNumber = Math.random()*3;
    if(randomNumber > 0 && randomNumber <= 1){
      return 'Bat';
    }
    else if(randomNumber > 1 && randomNumber <= 2){
      return 'Ball';
    }
    else {
      return 'Stump';
    }
  }
  function getResult(userMove, computerMove){
    if(userMove === 'Bat'){
      if(computerMove === 'Bat'){
        return `Match Draw`;
      }
      else if(computerMove === 'Ball'){
        return `User Won`;
      }
      else if(computerMove === 'Stump'){
        return `Computer Won`;
      }
    }
    else if(userMove === 'Ball'){
      if(computerMove === 'Bat'){
        return `Computer Won`;
      }
      else if(computerMove === 'Ball'){
        return `Match Draw`;
      }
      else if(computerMove === 'Stump'){
        return `User Won`;
      }
    }
    else{
      if(computerMove === 'Bat'){
        return `User Won`;
      }
      else if(computerMove === 'Ball'){
        return `Computer Won`;
      }
      else if(computerMove === 'Stump'){
        return `Match Draw`;
      }
    }
  }
  function showResult(userMove, computerMove, result){
    alert(`User's Choice is ${userMove} \n Computer's Choice is ${computerMove} \n Result is ${result}`);
  }
</script>
</body>
</html>
