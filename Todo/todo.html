<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO</title>
</head>
<body>
  <div>
    <h1>Todo App</h1>
    <div class="todo_wrapper">
      <input type="text" placeholder="Enter a new todo..." id="todoInput">
      <input type=date placeholder="Enter a date..." id="todoDate">
      <button class="btn" onclick="addTodo();">ADD</button>
      <div class="todo_container">
      </div>

    </div>
  </div>
  <script>
    let  todoList = [];
    displayItems();
    function addTodo(){
      let todoElement = document.querySelector('#todoInput');
      let dateElement = document.querySelector('#todoDate');
      let todoItem = todoElement.value;
      let todoDate = dateElement.value;
      todoList.push({item : todoItem, dueDate : todoDate});
      todoElement.value = '';
      dateElement.value = '';
      displayItems();
    }

    function displayItems(){
      let displayElement = document.querySelector('.todo_container');
      let newhtml = '';
      displayElement.innerText = '';
      for(let i = 0; i < todoList.length; i++){
        // let item = todoList[i].item;
        // let dueDate = todoList[i].dueDate;
        let {item, dueDate} = todoList[i];
        newhtml += `<div><span>${item}</span><span>${dueDate}</span> <button onclick="todoList.splice(${i}, 1); displayItems();">Delete</button></div>`;
        displayElement.innerHTML = newhtml;
      }
    }
  </script>

</body>
</html>
